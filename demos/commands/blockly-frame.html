    <style>
      html, body {
        background-color: #fff;
        margin: 0;
        padding: 0;
        overflow: hidden;
        height: 100%;
      }
      .blocklySvg {
        height: 100%;
        width: 100%;
      }
    </style>
    <script>
      function init() {
        Blockly.inject(document.body,
            {toolbox: document.getElementById('toolbox')});
        // Let the top-level application know that Blockly is ready.
        window.parent.blocklyLoaded(Blockly);
      }
    </script>
  </head>
  <body onload="init()">
    <xml id="toolbox" style="display: none">

<category name="Entradas/Saídas">
  <block type="pinos_in_pullup"></block>
    <block type="pinos_output"></block>
    <block type="define_estado_saida"></block>
    <block type="pino_boolean"></block>
</category>

      <category name="Matematica">
		  <block type="math_number"></block>
		  <block type="math_arithmetic"></block>
	  </category>

      <category name="Variaveis">
		  <block type="variables_get"></block>
		  <block type="variables_set"></block>
	  </category>


      <category name="Lógica">
		  <block type="controls_if"></block>
				
        <block type="logic_compare"></block>
      <block type="logic_boolean"></block>


		  <block type="logic_negate"></block>		  
		  <block type="logic_operation"></block>
	 </category>	     
		  
	

	<category name="Laços" colour="210">
		  <block type="controls_repeat"></block>
		  <block type="controls_repeat_ext"></block>
		  <block type="controls_whileUntil"></block>
		
				
    </category>

	<category name="Tempo" colour="120">
            <block type="atraso_segundos"></block>
		    <block type="atraso_milisegundos"></block>
	  </category>
	  
	
			

     
     

    </xml>

    
  </body>
</html>
